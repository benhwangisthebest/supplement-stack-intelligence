name: CI

# Phase 0 U5 — minimal verification workflow.
# Spec: docs/01-plan/phase-0-integration-enforcement.plan.md (U5)
# Review: docs/reviews/phase-0-plan-review.md (P-03, P-06, P-07, P-10, P-11)
#
# Deliberately minimal. Four blocking steps that mirror the local suite:
#   npm ci -> typecheck -> unit+architecture tests -> production build
#
# NOT included, each for a verified reason:
#   * lint            - `next lint` has zero eslint dependency and no config,
#                       so it passes vacuously or fails spuriously (P-10).
#   * boundary tests  - `src/architecture/boundaries.test.ts` is already collected
#                       and executed by the standard `vitest run` in the `npm test`
#                       step below; a separate step would be pure duplication
#                       (P-06, verified). Its test count is not pinned here - it
#                       grows as rules are added.
#   * coverage gate   - per-engine thresholds fail today (P-07); widening scope
#                       does not imply a global floor is safe (P-08).
#   * (E2E was here)  - NO LONGER EXCLUDED. Phase 2 U14 added the stage below,
#                       discharging N-29. The original reason - "17/23 specs are
#                       E2E_LIVE-gated and the suite races a single shared
#                       seeded user under fullyParallel" (P-11) - was correct for
#                       the suite as a whole and INCIDENTAL for the specs that
#                       matter here: without E2E_LIVE those 30 tests skip, and
#                       the 64 that run are credential-free and read-only against
#                       the public Library. Verified before wiring, not assumed:
#                       a clean clone with no .env.local, CI=1, against a
#                       production build ran 64 passed / 30 skipped.
#   * secrets         - none required. getSupabaseEnv() reads process.env inside
#                       the function body and throws at call time, and the only
#                       generateStaticParams route imports no Supabase client,
#                       so `next build` and the unit suite need no credentials.
#                       The repository is PUBLIC: adding secrets would create an
#                       exfiltration surface for zero benefit (P-03).

on:
  # Verification before integration into main.
  pull_request:
    branches: [main]
  # Post-merge verification on `main`, and pre-integration verification on every
  # other branch: any branch push runs the same four steps, so work is verified
  # before it is fast-forwarded into `main`.
  #
  # No branch-prefix list here, deliberately. An enumerated list (`main` +
  # `feat/**`) silently excluded every `fix/*`, `docs/*`, `chore/*` and `qa/*`
  # branch for the whole of Phase 0, each of which then needed a manual
  # `workflow_dispatch` before integration. A prefix list goes stale the first
  # time someone picks a new prefix; `**` cannot.
  push:
    branches: ["**"]
  # Manual re-run. Note: only selectable in the UI once this file exists on the
  # default branch.
  workflow_dispatch:

# Least privilege. This workflow only reads the repo; it publishes nothing.
# pull_request_target is deliberately NOT used - it would expose repository
# scope to fork pull requests on a public repository.
permissions:
  contents: read

# One run per ref. Supersede an in-flight run when new commits arrive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The repository declares no Node version (no engines field, no .nvmrc,
      # no .node-version), so CI pins one explicitly. 20 LTS is the Phase 0
      # approved choice and is fully supported by Next 15.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # `npm ci` (never `npm install`) - reproducible install from the
      # lockfile (lockfileVersion 3). Fails if the lockfile is out of sync.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Includes the architecture-boundary suite - no separate step needed.
      - name: Unit and architecture tests
        run: npm test

      # Phase 1 U13 - per-engine coverage floors (gate D1: "CI gains a coverage
      # step, or the criterion is unmet").
      #
      # A SEPARATE step, not `npm test` swapped for the coverage run, for two
      # reasons. It keeps the four steps above byte-identical, so this change is
      # provably additive. And it keeps the two failure modes distinguishable: a
      # red `npm test` means a broken assertion, a red step here means coverage
      # fell through a floor. Folding them together would report both as "tests
      # failed" and make the second look like the first.
      #
      # It re-runs the suite (~5s). Measured and accepted rather than optimised:
      # the alternative is a coverage artifact passed between steps, which is
      # more machinery than the saving justifies.
      #
      # The floors themselves, and the D-2 jitter constraint that sets their
      # margin, are documented in vitest.config.ts beside the numbers.
      - name: Coverage thresholds
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      # Phase 2 U28 - N-38. Asserts this build produced the SAME app production
      # runs (GATE D1: CLAUDE.md §5's declared chain is updated in this commit).
      #
      # A credentialed build emits ZERO prerendered page HTML, because getUser()
      # reaches cookies() from the root layout on every page. A clean-env build
      # used to emit 20 - so CI, which has no credentials BY DESIGN (P-03, this
      # repository is public), was building a materially different app from
      # production for as long as CI has existed. U14's CSP was simply the first
      # thing whose evidence depended on the difference.
      #
      # The predicate is a zero, not a route list: lists go stale the first time
      # someone adds a route, and this one governs routes nobody has written yet.
      # Costs a directory read, no rebuild - which is why it runs here rather
      # than joining verify:middleware in the developer-run pile.
      - name: Rendering determinism
        run: npm run verify:rendering
      # -----------------------------------------------------------------
      # Phase 2 U14 - E2E, discharging N-29 (GATE D1: CLAUDE.md §5's declared
      # chain is updated in the SAME commit as these two steps).
      #
      # WHY IT EXISTS. `src/architecture/security-headers.test.ts` asserts what
      # `next.config.ts` DECLARES; only an E2E can see what a client RECEIVES.
      # U13 shipped that spec and it ran nowhere but a developer's laptop, so by
      # §10.3 - "guardrails that do not run in CI do not exist" - the delivery
      # half of the security headers was unenforced. U14 adds a CSP whose whole
      # evidence is response bytes, so it needs this stage for itself and
      # inherited N-29 on the same reasoning.
      #
      # IT ALSO CARRIES U27'S LIVENESS PROOF. The Report-Only header this suite
      # asserts cannot exist unless `src/middleware.ts` actually executed, which
      # is the one thing U27's source-level guard cannot check and its
      # build-artifact script (`npm run verify:middleware`) cannot check here,
      # because `vitest run` precedes `next build` in this chain.
      #
      # FULL SUITE, not just the headers spec. N-29 requires only
      # `security-headers.spec.ts`, but the clean-env simulation showed the whole
      # non-live suite green with no secrets present, so scoping it down would
      # discard free coverage. The 30 E2E_LIVE-gated specs skip: no credentials
      # are configured here and none should be (P-03 - this repository is
      # public).
      #
      # THE SECOND BUILD IS REAL AND IS NOT HIDDEN. playwright.config.ts runs
      # `npm run build && npm run start`, and `reuseExistingServer` is false
      # under CI by design - which is also what makes CI immune to N-32, the
      # stale-dev-server hazard that silently substituted itself for a
      # production build during local measurement. Folding the two builds
      # together would need a script that hides a step from this file, and an
      # honest duplicate beats a hidden merge.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (non-live)
        run: npm run test:e2e
